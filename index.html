<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GeoDuel</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="theme-classic">
  <header>
    <h1>🌍 GeoDuel</h1>
    <div class="hud">
      <div id="locationDisplay">📍 Locație: ...</div>
      <div id="scoreDisplay">🏆 Scor: ...</div>
      <div id="missionDisplay" class="hud__mission">🎯 Misiune: ...</div>
    </div>
    <div class="controls">
      <button onclick="showStats()">📊 Vezi statistici</button>
      <button onclick="showAchievements()">🏅 Realizări</button>
      <label for="themeSelector">🎨 Tema:</label>
      <select id="themeSelector">
        <option value="classic">Clasic</option>
        <option value="dark">Întunecat</option>
        <option value="tropical">Tropical</option>
      </select>
    </div>
  </header>

  <main>
    <div id="gameContainer">
      <!-- Map and game UI will be injected here -->
    </div>
  </main>

  <!-- Stats Modal -->
  <div id="statsModal" class="modal hidden">
    <div class="modal__content">
      <h2>📊 Statistici</h2>
      <canvas id="statsChart" width="300" height="200"></canvas>
      <button onclick="closeStats()">Închide</button>
    </div>
  </div>

  <!-- Achievements Modal -->
  <div id="achievementsModal" class="modal hidden">
    <div class="modal__content">
      <h2>🏅 Realizări</h2>
      <div id="achievementsList" class="achievements-list"></div>
      <button onclick="closeAchievements()">Închide</button>
    </div>
  </div>

  <!-- Scripts -->
  <script type="module">
    import { loadMissions, checkMissionProgress } from './js/missions.js';
    import { loadAchievements, checkAchievements } from './js/achievements.js';
    import { showAchievements, closeAchievements } from './js/achievementsUI.js';
    import { showStats, closeStats } from './js/stats.js';
    import { initThemeSelector } from './js/themeSelector.js';

    document.addEventListener('DOMContentLoaded', () => {
      loadMissions();
      loadAchievements();
      initThemeSelector();
    });

    // Example hook after each answer
    window.afterAnswer = function () {
      checkMissionProgress();
      checkAchievements();
    };
  </script>
</body>
</html>
